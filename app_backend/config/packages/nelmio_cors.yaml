nelmio_cors:
    defaults:
        origin_regex: false
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']

        allow_credentials: true
        allow_headers: ['Content-Type', 'Authorization', 'Accept', 'Cookie']
        expose_headers: ['Link', 'Set-Cookie']
        max_age: 3600
    paths:
        '^/': null
